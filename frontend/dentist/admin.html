<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Appointments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-icon"><img src="logo.png" alt="Logo" class="logo-img" /></span>
        <span>XYZ Dental <small>Clinic</small></span>
      </a>
      <span class="admin-badge">Admin Panel</span>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <p class="section-tag">Appointments</p>
          <h2>Manage Bookings</h2>
        </div>

        <div class="admin-stats" id="adminStats"></div>

        <div class="admin-filters">
          <select id="filterStatus">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input type="date" id="filterDate" />
          <button class="btn btn-outline" id="refreshBtn">Refresh</button>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table" id="appointmentsTable">
            <thead>
              <tr>
                <th>Token</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Service</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="appointmentsBody"></tbody>
          </table>
          <p class="empty-state" id="emptyState" hidden>No appointments found.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 XYZ Dental Clinic. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var appointments = [];

      function loadAppointments() {
        fetch('/api/appointments')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            appointments = data;
            render();
          });
      }

      function render() {
        var statusFilter = document.getElementById('filterStatus').value;
        var dateFilter = document.getElementById('filterDate').value;

        var filtered = appointments.filter(function (a) {
          if (statusFilter !== 'all' && a.status !== statusFilter) return false;
          if (dateFilter && a.date !== dateFilter) return false;
          return true;
        });

        renderStats(filtered);
        renderTable(filtered);
      }

      function renderStats(list) {
        var total = list.length;
        var pending = list.filter(function (a) { return a.status === 'pending'; }).length;
        var confirmed = list.filter(function (a) { return a.status === 'confirmed'; }).length;
        var cancelled = list.filter(function (a) { return a.status === 'cancelled'; }).length;

        document.getElementById('adminStats').innerHTML =
          '<div class="stat-card"><span class="stat-num">' + total + '</span><span class="stat-lbl">Total</span></div>' +
          '<div class="stat-card stat-pending"><span class="stat-num">' + pending + '</span><span class="stat-lbl">Pending</span></div>' +
          '<div class="stat-card stat-confirmed"><span class="stat-num">' + confirmed + '</span><span class="stat-lbl">Confirmed</span></div>' +
          '<div class="stat-card stat-cancelled"><span class="stat-num">' + cancelled + '</span><span class="stat-lbl">Cancelled</span></div>';
      }

      function renderTable(list) {
        var tbody = document.getElementById('appointmentsBody');
        var empty = document.getElementById('emptyState');

        if (list.length === 0) {
          tbody.innerHTML = '';
          empty.hidden = false;
          return;
        }
        empty.hidden = true;

        list.sort(function (a, b) {
          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        tbody.innerHTML = list.map(function (a) {
          return '<tr class="status-row-' + a.status + '">' +
            '<td><strong>' + a.token + '</strong></td>' +
            '<td>' + a.name + '</td>' +
            '<td>' + a.phone + '</td>' +
            '<td>' + a.email + '</td>' +
            '<td>' + a.service + '</td>' +
            '<td>' + a.date + '</td>' +
            '<td>' + formatTime(a.time) + '</td>' +
            '<td><span class="badge badge-' + a.status + '">' + a.status + '</span></td>' +
            '<td class="actions-cell">' +
              (a.status === 'pending' ? '<button class="btn-sm btn-confirm" data-id="' + a.id + '" data-action="confirmed">Confirm</button>' : '') +
              (a.status !== 'cancelled' ? '<button class="btn-sm btn-cancel" data-id="' + a.id + '" data-action="cancelled">Cancel</button>' : '') +
              '<button class="btn-sm btn-delete" data-id="' + a.id + '">Delete</button>' +
            '</td>' +
          '</tr>';
        }).join('');
      }

      function formatTime(t) {
        var parts = t.split(':');
        var h = parseInt(parts[0], 10);
        var m = parts[1];
        var ampm = h < 12 ? ' AM' : ' PM';
        var h12 = h <= 12 ? h : h - 12;
        if (h12 === 0) h12 = 12;
        return h12 + ':' + m + ampm;
      }

      function updateStatus(id, status) {
        fetch('https://backend-2103.vercel.app/api/appointments' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: status }),
        }).then(function () { loadAppointments(); });
      }

      function deleteAppointment(id) {
        if (!confirm('Delete this appointment?')) return;
        fetch('/api/appointments/' + id, { method: 'DELETE' })
          .then(function () { loadAppointments(); });
      }

      document.getElementById('filterStatus').addEventListener('change', render);
      document.getElementById('filterDate').addEventListener('change', render);
      document.getElementById('refreshBtn').addEventListener('click', loadAppointments);

      document.getElementById('appointmentsBody').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var id = btn.dataset.id;
        if (btn.classList.contains('btn-delete')) {
          deleteAppointment(id);
        } else if (btn.dataset.action) {
          updateStatus(id, btn.dataset.action);
        }
      });

      loadAppointments();
    })();
  </script>
</body>
</html>
